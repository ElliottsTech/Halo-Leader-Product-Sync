<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Price Calculator</title>
    <link rel="stylesheet" href="/Leader-Halo/styles.css">
</head>

<body>
    <div id="app">
        <h1>Price Calculator</h1>

        <div class="row">
            <label for="category">Pricing category</label>
            <select id="category"></select>
        </div>

        <div class="price-grid">
            <div>
                <span>Cost (ex GST)</span>
                <div class="linked-inputs">
                    <input id="cost-ex" type="number" step="0.01" min="0" value="0" placeholder="0.00">
                </div>
            </div>
            <div>
                <span>Cost (inc GST)</span>
                <div class="linked-inputs">
                    <input id="cost-inc" type="number" step="0.01" min="0" value="0" placeholder="0.00">
                </div>
            </div>
            <div class="highlight">
                <span>Retail price</span>
                <strong id="retail">$0.00</strong>
                <small id="retail-ex" class="sub-price">$0.00 ex GST</small>
            </div>
            <div><span>Wholesale</span><strong id="wholesale">$0.00</strong></div>
            <div><span>Staff price</span><strong id="staff">$0.00</strong></div>
            <div><span>Margin applied</span><strong id="margin">0%</strong></div>
        </div>

        <p id="tier" class="meta"></p>

        <!-- Collapsible margin-table (read-only by default, edit with password) -->
        <details id="margin-editor" class="margin-editor">
            <summary id="margin-summary">Margin tiers</summary>
            <div class="row" style="padding: 8px 14px;">
                <button id="edit-toggle" class="edit-toggle">🔒 Edit</button>
                <p id="margin-msg" class="msg"></p>
            </div>
            <div id="margin-scroll">
                <table id="margin-table"></table>
            </div>
            <div class="row add-category-row" id="add-cat-row" style="display:none;">
                <input id="new-cat-name" type="text" placeholder="New pricing category name">
                <input id="new-cat-margin" type="number" min="0" max="100" step="0.1" value="25" title="Flat margin % for all tiers">
                <button id="add-category">Add category</button>
            </div>
            <div class="row" id="reset-row" style="display:none; padding: 0 14px 8px;">
                <button id="reset-margins" class="danger">Reset to defaults</button>
            </div>
        </details>
    </div>
    <script src="/Leader-Halo/calc.js"></script>
</body>

</html>
